# XcodeGen spec for the Flowbiz demo app (SPEC §14).
# Generate the project with:  cd ios/Demo && xcodegen generate
# The generated FlowbizDemo.xcodeproj and Sources/Info.plist are gitignored.
name: FlowbizDemo
options:
  bundleIdPrefix: br.com.flowbiz.onsite
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  # Local package dependency on the repo root (Package.swift → FlowbizOnsite).
  FlowbizOnsite:
    path: ../..
targets:
  FlowbizDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: FlowbizOnsite
        product: FlowbizOnsite
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Flowbiz Demo
        UILaunchScreen: {}
        # SPEC §11 deep-link entry point. A custom scheme keeps the demo
        # self-contained (a real integration uses Universal Links, which
        # require an entitlement + apple-app-site-association). Try it with
        # a MessageBuilder-shaped link (its UTMs are captured, SPEC §11.1):
        #   xcrun simctl openurl booted "flowbizdemo://recover?_mb_cr_=<hash>&utm_journey=16&utm_journey_channel=email&utm_source=flowbiz&utm_medium=email&utm_campaign=jornadas%7Ccart%7Ccarrinho-abandonado&utm_journey_type=1"
        # — or use the in-app "simulate recovery link" button.
        CFBundleURLTypes:
          - CFBundleURLName: br.com.flowbiz.onsite.demo
            CFBundleURLSchemes:
              - flowbizdemo
