name: FlowbizDemo
options:
  bundleIdPrefix: br.com.flowbiz.onsite
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  FlowbizOnsite:
    path: ../..
targets:
  FlowbizDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: FlowbizOnsite
        product: FlowbizOnsite
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Flowbiz Demo
        UILaunchScreen: {}
        # Demo only: recovery links need Universal Links; a custom scheme has no web fallback.
        CFBundleURLTypes:
          - CFBundleURLName: br.com.flowbiz.onsite.demo
            CFBundleURLSchemes:
              - flowbizdemo
