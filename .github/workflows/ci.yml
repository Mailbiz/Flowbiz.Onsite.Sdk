name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (ubuntu, JDK 17)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, release AAR, lint
        working-directory: android
        run: ./gradlew :sdk:testDebugUnitTest :demo:testDebugUnitTest :sdk:assembleRelease :sdk:lint

  ios:
    name: iOS (macOS 15, Xcode 16.4)
    runs-on: blacksmith-6vcpu-macos-15
    env:
      # Pinned: an older default Xcode compiles the Swift Testing suites away and the job still goes green.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain sanity (Swift >= 6 required for Swift Testing)
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - name: swift test (macOS host)
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Assert swift test actually ran the suite (>= 150 tests)
        run: |
          set -euo pipefail
          FLOOR=150
          COUNT=$(sed -nE 's/.*Test run with ([0-9]+) tests? passed.*/\1/p' swift-test.log | tail -1)
          echo "Swift Testing executed-test count: ${COUNT:-<none>}"
          if [ -z "${COUNT}" ] || [ "${COUNT}" -lt "${FLOOR}" ]; then
            echo "::error::swift test ran ${COUNT:-0} tests (< ${FLOOR}) — Swift Testing suites were not executed (toolchain too old?)"
            exit 1
          fi
      # The canImport(UIKit) code only compiles in an iOS build, which the macOS host run never does.
      - name: xcodebuild test (iOS Simulator, iPhone 16)
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme FlowbizOnsite \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            2>&1 | tee xcodebuild-test.log
      - name: Assert xcodebuild actually ran the suite (>= 150 tests)
        run: |
          set -euo pipefail
          FLOOR=150
          MAX=$( { sed -nE 's/.*Test run with ([0-9]+) tests? passed.*/\1/p' xcodebuild-test.log; \
                   sed -nE 's/.*Executed ([0-9]+) tests?,.*/\1/p' xcodebuild-test.log; } \
                 | sort -n | tail -1 )
          echo "xcodebuild max executed-test count: ${MAX:-<none>}"
          if [ -z "${MAX}" ] || [ "${MAX}" -lt "${FLOOR}" ]; then
            echo "::error::xcodebuild ran ${MAX:-0} tests (< ${FLOOR}) — simulator run did not execute the full suite"
            exit 1
          fi
