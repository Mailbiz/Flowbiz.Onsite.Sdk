# SPEC §13: one pipeline releases both platforms from a single vX.Y.Z tag —
# the AAR is published to Maven Central; the iOS release is the git tag
# itself (SPM resolves it, source-distributed package).
#
# One-time prerequisites (the br.com.flowbiz namespace is already verified
# in the Central Portal):
#   - repository secrets: CENTRAL_USERNAME, CENTRAL_PASSWORD (a Central
#     Portal user token — OSSRH tokens get 401), SIGNING_IN_MEMORY_KEY
#     (ASCII-armored GPG private key), SIGNING_IN_MEMORY_KEY_PASSWORD
#   - the signing key's public half uploaded to a keyserver
#     (keys.openpgp.org or keyserver.ubuntu.com) — Central validates it
#
# Publishing goes through the Portal's OSSRH Staging API compatibility
# service: Gradle's maven-publish PUTs the artifacts into an implicitly
# created staging repository, and a final POST hands that repository to the
# Central Portal, where the deployment is reviewed and released by hand.
# Without that POST the upload never shows up in the Portal (Sonatype docs:
# central.sonatype.org/publish/publish-portal-ossrh-staging-api/).
name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify-versions:
    name: Tag matches SDK version constants
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # The two SDKs version in lockstep (SPEC §13); a tag that does not
      # match every version constant must never publish anything.
      # Extract the actual version value from each file and string-compare
      # against the tag (rather than grepping for a whole expected line, which
      # cannot report WHAT the file says when it mismatches and silently
      # passes if the expected string appears anywhere).
      - name: Assert SdkVersion.CURRENT / SDKVersion.current / Gradle version == tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: ${TAG_VERSION}"

          ANDROID_VERSION=$(sed -nE 's/^[[:space:]]*const val CURRENT: String = "([^"]+)".*/\1/p' \
            android/sdk/src/main/kotlin/br/com/flowbiz/onsite/SdkVersion.kt)
          IOS_VERSION=$(sed -nE 's/^[[:space:]]*static let current = "([^"]+)".*/\1/p' \
            ios/Sources/FlowbizOnsite/SDKVersion.swift)
          GRADLE_VERSION=$(sed -nE 's/^version = "([^"]+)".*/\1/p' \
            android/sdk/build.gradle.kts)

          echo "Android SdkVersion.CURRENT: ${ANDROID_VERSION:-<not found>}"
          echo "iOS SDKVersion.current:     ${IOS_VERSION:-<not found>}"
          echo "Gradle publish version:     ${GRADLE_VERSION:-<not found>}"

          FAIL=0
          [ "${ANDROID_VERSION}" = "${TAG_VERSION}" ] \
            || { echo "::error::Android SdkVersion.CURRENT is '${ANDROID_VERSION:-<not found>}', tag is '${TAG_VERSION}'"; FAIL=1; }
          [ "${IOS_VERSION}" = "${TAG_VERSION}" ] \
            || { echo "::error::iOS SDKVersion.current is '${IOS_VERSION:-<not found>}', tag is '${TAG_VERSION}'"; FAIL=1; }
          [ "${GRADLE_VERSION}" = "${TAG_VERSION}" ] \
            || { echo "::error::Gradle publish version is '${GRADLE_VERSION:-<not found>}', tag is '${TAG_VERSION}'"; FAIL=1; }
          exit "${FAIL}"

  android-publish:
    name: Publish AAR to Maven Central
    needs: verify-versions
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (gate before publishing)
        working-directory: android
        run: ./gradlew :sdk:testDebugUnitTest
      # Requires the secrets listed in the header. Without them this step
      # fails at authentication — intentionally, so a tag can never silently
      # "release" nothing. Signing activates via the ORG_GRADLE_PROJECT_*
      # properties (see android/sdk/build.gradle.kts); without them the
      # artifacts would be unsigned and Central would reject them.
      - name: Publish signed artifacts to Central staging
        working-directory: android
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew :sdk:publishReleasePublicationToCentralRepository
      # The staging API groups the PUTs above into one repository by client
      # IP, so this hand-off MUST run in the same job (same runner, same IP).
      # publishing_type=user_managed: the deployment lands in
      # https://central.sonatype.com/publishing/deployments for a manual
      # "Publish" (or "Drop") — nothing reaches Maven Central without that
      # click. Switch to `automatic` to release straight through once the
      # process is trusted.
      # Triage: if this step fails, the staging repository is left behind and
      # blocks later uploads from the same IP — list it with
      #   GET /manual/search/repositories?ip=any&profile_id=br.com.flowbiz
      # and DELETE /manual/drop/repository/<key> (same Bearer auth).
      - name: Hand the staging repository to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s:%s' "${CENTRAL_USERNAME}" "${CENTRAL_PASSWORD}" | base64 | tr -d '\n')
          curl --fail-with-body --silent --show-error -X POST \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/br.com.flowbiz?publishing_type=user_managed&deployment_name=onsite-sdk-${GITHUB_REF_NAME#v}" \
            -H "Authorization: Bearer ${TOKEN}"
          echo
          echo "Deployment uploaded — review and Publish it at https://central.sonatype.com/publishing/deployments"

  # ios-release:
  #   name: iOS release (SPM = the tag)
